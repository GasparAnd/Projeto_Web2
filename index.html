<!DOCTYPE html>
<html>
    <head>
        <title>Portfólio de Imagens</title>
    </head>
    <body>
        <h1>Meu Portfólio</h1>

        <h2>Galeria de Fotos:</h2>

        <figure>
            <img src="img/Naruto.webp" alt="Imagem de Naruto" width="150">
            <figcaption>Naruto</figcaption>  
        </figure>

        <figure>
            <img src="img/images.jpeg" alt="Imagem de One piece" width="150">
            <figcaption>One piece</figcaption>  
        </figure>

        <figure>
            <img src="img/Dragonball.jpeg" alt="Imagem Dragonball Z" width="150">
            <figcaption>Dragonball Z</figcaption>  
        </figure>
    </body>
</html>
